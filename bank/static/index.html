<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기업 공시 RAG 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 780px;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 20px 24px;
      background: #1a1a2e;
      color: #fff;
    }

    header h1 { font-size: 18px; font-weight: 600; }
    header p  { font-size: 13px; color: #a0a8c0; margin-top: 4px; }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .msg.user  { align-self: flex-end; align-items: flex-end; }
    .msg.bot   { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: #f0f2f5;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .source {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      padding: 0 4px;
    }

    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .dot {
      width: 8px; height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    #input:focus { border-color: #1a1a2e; }

    #send-btn {
      padding: 12px 22px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #send-btn:hover   { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 기업 공시 RAG 챗봇</h1>
      <p>DART 공시 및 증권사 리포트를 기반으로 질문에 답변합니다.</p>
    </header>

    <div id="chat-box">
      <div class="msg bot">
        <div class="bubble">안녕하세요! 기업 공시나 증권사 리포트에 대해 질문해보세요.<br>예) 삼성전자 2024년 영업이익은 얼마인가요?</div>
      </div>
    </div>

    <div class="input-area">
      <input id="input" type="text" placeholder="질문을 입력하세요..." />
      <button id="send-btn">전송</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const input   = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(role, text, sources = []) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);

      if (sources.length > 0) {
        const src = document.createElement('div');
        src.className = 'source';
        src.textContent = `📄 출처: ${sources.join(', ')}`;
        msg.appendChild(src);
      }

      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    function addTyping() {
      const msg = document.createElement('div');
      msg.className = 'msg bot typing';
      msg.innerHTML = '<div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    async function send() {
      const question = input.value.trim();
      if (!question) return;

      input.value = '';
      sendBtn.disabled = true;
      addMessage('user', question);

      const typing = addTyping();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        typing.remove();
        addMessage('bot', data.answer, data.sources);
      } catch (e) {
        typing.remove();
        addMessage('bot', '❌ 서버 오류가 발생했습니다. 다시 시도해주세요.');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
