<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입</title>
  </head>
  <body>
    <h1>👋회원가입👋</h1>

    <form action="/join" method="POST">
      <!-- 1. 이름 -->
      <p>
        <label for="name">이름 *</label><br />
        <input
          type="text"
          id="name"
          name="name"
          placeholder="이름을 입력하세요"
          required
        />
      </p>

      <!-- 2. 이메일 -->
      <p>
        <label for="email">이메일 *</label><br />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          required
        />
      </p>

      <!-- 3. 생년월일 -->
      <p>
        <label for="birthday">생년월일</label><br />
        <input type="date" id="birthday" name="birthday" />
      </p>

      <!-- 4. 성별 -->
      <p>
        <label>성별</label><br />
        <label><input type="radio" name="gender" value="male" /> 남성</label>
        <label><input type="radio" name="gender" value="female" /> 여성</label>
        <label
          ><input type="radio" name="gender" value="none" /> 선택 안 함</label
        >
      </p>

      <!-- 5. 관심분야 -->
      <p>
        <label>관심분야</label><br />
        <label
          ><input type="checkbox" name="interests" value="sports" />
          스포츠</label
        >
        <label
          ><input type="checkbox" name="interests" value="music" /> 음악</label
        >
        <label
          ><input type="checkbox" name="interests" value="travel" /> 여행</label
        >
        <label
          ><input type="checkbox" name="interests" value="tech" /> 기술</label
        >
        <label
          ><input type="checkbox" name="interests" value="food" /> 음식</label
        >
      </p>

      <!-- 6. 거주지역 -->
      <p>
        <label for="region">거주지역</label><br />
        <select id="region" name="region">
          <option value="">-- 선택하세요 --</option>
          <option value="seoul">서울</option>
          <option value="busan">부산</option>
          <option value="incheon">인천</option>
          <option value="daegu">대구</option>
          <option value="daejeon">대전</option>
          <option value="gwangju">광주</option>
          <option value="ulsan">울산</option>
          <option value="sejong">세종</option>
          <option value="gyeonggi">경기</option>
          <option value="etc">기타</option>
        </select>
      </p>

      <!-- 7. 가입동기 -->
      <p>
        <label for="motivation">가입동기</label><br />
        <textarea
          id="motivation"
          name="motivation"
          rows="4"
          cols="40"
          placeholder="가입하게 된 계기를 자유롭게 적어주세요."
        ></textarea>
      </p>

      <button type="submit">가입하기</button>
    </form>
  </body>
</html>
